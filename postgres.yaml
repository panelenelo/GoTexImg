services:
  postgres:
    image: postgres:14-alpine
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_DB=${PGRS_DB}
      - POSTGRES_USER=${PGRS_USER}
      - POSTGRES_PASSWORD=${PGRS_PASS}
    ports:
    - "${PGRS_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
